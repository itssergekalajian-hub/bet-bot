name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile bot
        run: python -m py_compile telegram_bet_analyzer_bot.py
      - name: Run reliability assertions
        run: python -m unittest discover -s tests -v
